<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Color Picker</title><desc id="d">Banner showing a picked color in several formats and its contrast against white and black.</desc><defs>
